# ProDeck — booth hub as a Docker service.
#
# Quick start:
#   docker compose up -d
#
# Open http://<server-ip>:4000 in any browser.

services:
  prodeck:
    image: ghcr.io/nick-116/prodeck:latest
    container_name: prodeck

    restart: unless-stopped

    # Host networking gives the container the real network stack so mDNS/
    # Bonjour discovery finds ProPresenter without any manual IP entry.
    network_mode: host

    # Persist settings, identity, check-in data, PCO cache, etc.
    volumes:
      - prodeck_data:/home/prodeck/.config/ProDeck

    environment:
      PRODECK_ADMIN_PASSWORD: password
      PRODECK_PORT: 4000
    #   RUST_LOG: info
    #   PRODECK_NDI_LIB: /usr/local/lib/libndi.so

    # Audio: pass the ALSA sound card into the container for SPL metering
    # and the MP3 listen stream. Comment out if not using audio input.
    # devices:
    #   - /dev/snd:/dev/snd
    # group_add:
    #   - audio

    # Resource limits.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

volumes:
  prodeck_data:
    driver: local
