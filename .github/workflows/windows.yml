name: Windows build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      # master too, not just the Windows track. The release script builds the
      # installer as a step of publishing, so a Windows break that nobody knew
      # about used to surface for the first time mid-release — after the
      # ten-minute universal Mac build — and abort it. Catch it on the commit
      # that caused it instead.
      - master
      - windows-harbor

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: |
          npm test
          npx tsc --noEmit

      # Must come before the Rust tests: web.rs embeds the built frontend with
      # include_dir!("$CARGO_MANIFEST_DIR/../dist"), which panics at COMPILE
      # time if dist/ is absent. `npm test` and `tsc --noEmit` don't produce it.
      # Not a Windows issue — a clean checkout fails the same way on any OS.
      - name: Build frontend
        run: npm run build

      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.windows.conf.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ProDeck-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

# NO attach-on-release job, deliberately. scripts/release-public.sh dispatches
# this workflow for the release commit, waits for it, downloads THIS .exe, signs
# it with the minisign updater key (which only lives on the release Mac) and
# attaches that exact file. A job here that built its own copy and uploaded it
# over ours would replace signed bytes with unsigned-but-different ones, and
# every Windows auto-update would then fail signature verification.
